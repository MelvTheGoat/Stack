# Build, prove it works, then deploy:
#   gcloud builds submit --config cloudbuild.yaml
#
# The smoke test is a build step on purpose. A container can boot cleanly and
# still 500 on the review queue, so nothing deploys until the real pages have
# been opened against the real image.
substitutions:
  _SERVICE: recon
  _REGION: europe-west1
  _SECRET: paystack-test-key

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - gcr.io/$PROJECT_ID/$_SERVICE:$SHORT_SHA
  - gcr.io/$PROJECT_ID/$_SERVICE:latest

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=gcr.io/$PROJECT_ID/$_SERVICE:$SHORT_SHA
      - --tag=gcr.io/$PROJECT_ID/$_SERVICE:latest
      - .

  - id: smoke-test
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        trap 'docker rm -f smoke >/dev/null 2>&1 || true' EXIT
        docker run -d --name smoke \
          -e PAYSTACK_SECRET_KEY=sk_test_smoke \
          -e RECON_OFFLINE=1 \
          gcr.io/$PROJECT_ID/$_SERVICE:$SHORT_SHA
        docker cp scripts/smoke.py smoke:/tmp/smoke.py
        docker exec smoke python /tmp/smoke.py http://localhost:8080

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=gcr.io/$PROJECT_ID/$_SERVICE:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --set-env-vars=RECON_OFFLINE=0
      - --set-secrets=PAYSTACK_SECRET_KEY=$_SECRET:latest
