<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Reconciliation{% endblock %}</title>
<style>
  :root {
    --ink: #16191d; --muted: #5b6570; --line: #e3e7eb; --bg: #fbfcfd;
    --ok: #0d7a4a; --warn: #9a6100; --risk: #a4232b; --accent: #0b5cd5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 14px 20px;
           display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  header nav a { color: var(--accent); text-decoration: none; margin-right: 14px; }
  main { max-width: 960px; margin: 0 auto; padding: 20px; }
  .lede { color: var(--muted); margin: 0 0 18px; }
  .tiles { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: 8px;
          padding: 12px 16px; min-width: 150px; }
  .tile .n { font-size: 20px; font-weight: 600; }
  .tile .k { color: var(--muted); font-size: 12px; text-transform: uppercase;
             letter-spacing: .04em; }
  .item { background: #fff; border: 1px solid var(--line); border-radius: 8px;
          padding: 14px 16px; margin-bottom: 12px; }
  .item h3 { margin: 0 0 2px; font-size: 15px; }
  .item .meta { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .narration { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
               font-size: 13px; background: #f4f6f8; padding: 6px 8px;
               border-radius: 5px; word-break: break-word; }
  .risk { color: var(--risk); font-weight: 600; }
  .cand { border-top: 1px solid var(--line); padding: 10px 0 0; margin-top: 10px; }
  .cand ul { margin: 4px 0 8px; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .conf { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 12px;
          background: #eef2f6; color: var(--muted); }
  .conf.high { background: #e3f4ec; color: var(--ok); }
  .conf.low { background: #fdecec; color: var(--risk); }
  form { display: inline; }
  button { font: inherit; padding: 5px 11px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--line); background: #fff; }
  button.yes { background: var(--ok); border-color: var(--ok); color: #fff; }
  select { font: inherit; padding: 5px; border-radius: 6px; border: 1px solid var(--line); }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .done { color: var(--ok); }
  .problem { background: #fdecec; border: 1px solid #f3c9cb; border-radius: 6px;
             padding: 10px 12px; margin-bottom: 10px; }
  footer { color: var(--muted); font-size: 13px; padding: 30px 20px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Paystack reconciliation</h1>
  <nav>
    <a href="/review">Review queue</a>
    <a href="/report">Daily report</a>
    <a href="/health">Health</a>
  </nav>
  <span style="color:var(--muted);font-size:13px">test mode — this service never moves money</span>
</header>
<main>{% block body %}{% endblock %}</main>
<footer>Every decision here is written to an append-only audit log.</footer>
</body>
</html>
