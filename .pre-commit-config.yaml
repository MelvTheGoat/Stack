repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]

      - id: no-live-keys
        name: block live Paystack keys
        entry: bash -c 'if git diff --cached -U0 | grep -qE "^\+.*sk_live_"; then echo "A live secret key is in the diff. Stop."; exit 1; fi'
        language: system
        pass_filenames: false
